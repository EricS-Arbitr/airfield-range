# Ansible Galaxy requirements for this overlay.
#
# NEXUS SOURCING (2026-10-21): collections are pulled as built-artifact tarballs
# from the in-platform Nexus (ng_raw/galaxy) instead of galaxy.ansible.com. Nexus
# is reachable ONLY through the mgmt proxy and presents an internal-CA cert, so
# deploy.sh installs these with HTTPS_PROXY set AND --ignore-certs.
#
# deploy.sh installs these at the start of every run, so a normal deploy needs
# nothing done here by hand. To install manually, match how deploy.sh does it:
#
#   HTTPS_PROXY=http://10.255.240.1:3128 \
#     ansible-galaxy collection install -r /etc/ansible/requirements.yml \
#     -p /usr/share/ansible/collections --ignore-certs
#
# `-p` is the part that matters (see the 2026-09-18 note): /usr/share/ansible/
# collections is on every user's search path, so one copy serves both the
# root-cron deploy and a hand check as `simspace`.
#
# NOT listed (still from the RC_NG_Ansible base image, not yet on Nexus):
#   community.postgresql (fuel_db), community.crypto (email) -- add here once
#   uploaded to ng_raw/galaxy.
---
collections:
  - name: https://nexus.dev.ng.simspace.lan/repository/ng_raw/galaxy/pfsensible-core-0.7.1.tar.gz
  # ipaddr (common netplan prefix + 75-endpoint CIDR containment)
  - name: https://nexus.dev.ng.simspace.lan/repository/ng_raw/galaxy/ansible-utils-6.1.1.tar.gz
  - name: https://nexus.dev.ng.simspace.lan/repository/ng_raw/galaxy/ansible-windows-3.8.0.tar.gz
  - name: https://nexus.dev.ng.simspace.lan/repository/ng_raw/galaxy/community-windows-3.3.0.tar.gz
  - name: https://nexus.dev.ng.simspace.lan/repository/ng_raw/galaxy/microsoft-ad-1.12.1.tar.gz
  - name: https://nexus.dev.ng.simspace.lan/repository/ng_raw/galaxy/community-general-13.4.0.tar.gz
  - name: https://nexus.dev.ng.simspace.lan/repository/ng_raw/galaxy/community-docker-5.3.0.tar.gz
  - name: https://nexus.dev.ng.simspace.lan/repository/ng_raw/galaxy/vyos-vyos-6.0.0.tar.gz
  - name: https://nexus.dev.ng.simspace.lan/repository/ng_raw/galaxy/ansible-netcommon-8.6.2.tar.gz
