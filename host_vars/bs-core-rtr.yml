---
# host_vars/bs-core-rtr.yml — VyOS router (blackstone core, AS 65001 OSPF area 0)
# Image:   RC-VyOS-Router:1.1.0
# Mgmt:    10.255.240.165/20 (position LAST → eth6; SimSpace-managed)
#
# Role: blackstone enterprise core. OSPF area 0 on every interface (corp /24
# LANs + transit /30s); static default toward bs-edge-fw for the outbound
# path. No BGP (eBGP is at the WAN edge only — see bs-edge-rtr / bs-edge-fw).
ansible_host: "10.255.240.165"

network_interfaces:
  - name: "eth0"                     # switch-1 transit to bs-edge-fw
    ipv4:
      address: "172.31.1.6"
      netmask: "255.255.255.252"
      type: "ethernet"
      ospf: true
  - name: "eth1"                     # Services LAN gateway
    ipv4:
      address: "172.31.2.1"
      netmask: "255.255.255.0"
      type: "ethernet"
      ospf: true
  - name: "eth2"                     # Headquarters LAN gateway
    ipv4:
      address: "172.31.14.1"
      netmask: "255.255.255.0"
      type: "ethernet"
      ospf: true
  - name: "eth3"                     # IT LAN gateway
    ipv4:
      address: "172.31.15.1"
      netmask: "255.255.255.0"
      type: "ethernet"
      ospf: true
  - name: "eth4"                     # Supply LAN gateway
    ipv4:
      address: "172.31.16.1"
      netmask: "255.255.255.0"
      type: "ethernet"
      ospf: true
  - name: "eth5"                     # switch-2 transit to bs-ops-rtr
    ipv4:
      address: "172.31.1.9"
      netmask: "255.255.255.252"
      type: "ethernet"
      ospf: true

static_route:
  route: "0.0.0.0/0"
  next_hop: "172.31.1.5"             # bs-edge-fw (vmx3 SWITCH_1 .5)

# Strip image-baked self-loop defaults (one per /24 LAN IP). FRR refuses
# to install a default whose next-hop resolves to a local interface and
# ECMPs the whole route out of the FIB. See UPSTREAM_FIXES.md.
extra_static_routes_remove:
  - network: "0.0.0.0/0"
    next_hop: "172.31.2.1"           # own eth1 IP (Services)
  - network: "0.0.0.0/0"
    next_hop: "172.31.14.1"          # own eth2 IP (Headquarters)
  - network: "0.0.0.0/0"
    next_hop: "172.31.15.1"          # own eth3 IP (IT)
  - network: "0.0.0.0/0"
    next_hop: "172.31.16.1"          # own eth4 IP (Supply)

# Strip any iBGP the customer vyos role may have pushed in a prior deploy
# (architectural shift: OSPF area 0 is the corp IGP, eBGP at WAN only).
remove_vyos_bgp: true

# =========================================================================
# Security Onion GRE mirror — pairs with soc-sensor-corp
# =========================================================================
# Added 2026-08-11 with the SO blueprint additions. vyos_mirror builds a GRE
# tunnel to the sensor and installs `tc mirred` rules that copy each source
# interface into it. Suricata + Zeek on the sensor bind to tun0.
#
# ** VERIFY INTERFACE NUMBERING ON THE LIVE DEVICE FIRST. ** Blueprint NIC
# order did not match VyOS ethN on the so-ansible dev range
# (PORTING_GUIDE 9.9). `show interfaces` on bs-core-rtr and reconcile before
# deploying. The addresses below are drafted from this file's own
# network_interfaces, which is what the blueprint SHOULD produce.
#
# eth0 172.31.1.6 (from edge-fw) and eth5 172.31.1.9 (to ops-rtr) are transit /30s -- deliberately NOT mirrored. Mirroring the transit that
# carries the tunnel is how you build a feedback loop.
vyos_mirror_source_interfaces:
  - eth1   # 172.31.2.1  Services
  - eth2   # 172.31.14.1  Headquarters
  - eth3   # 172.31.15.1  IT
  - eth4   # 172.31.16.1  Supply

# ** DRAFT — VERIFY. ** Must be an address on this router with a route to
# 172.31.7.0/24 (the sensors sit behind bs-sec-rtr behind bs-ops-fw). This
# value MUST equal so_gre_remote_underlay in host_vars/soc-sensor-corp.yml exactly;
# a mismatch gives a tunnel that is UP with zero RX forever.
vyos_gre_source_ip: "172.31.1.9"
vyos_gre_remote_ip: "172.31.7.21"      # soc-sensor-corp prod IP
vyos_gre_local_addr: "10.100.1.1"
vyos_gre_remote_addr: "10.100.1.2"
vyos_gre_tunnel_prefix: 30

# Do NOT mirror management-plane traffic. Where a mgmt IP shares a data-plane
# interface, a bare matchall mirror copies every Ansible SSH/WinRM session into
# the sensor -- out-of-band traffic that is invisible in-scenario and pollutes
# detections. Rendered as tc `action pass` filters ahead of the catch-all.
vyos_mirror_exclude_cidrs:
  - "10.255.240.0/20"
