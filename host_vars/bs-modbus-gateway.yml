---
# host_vars/bs-modbus-gateway.yml — VyOS router (L3.5 OT boundary, STATIC-ONLY)
# Image:   RC-VyOS-Router:1.1.0
# Mgmt:    10.255.240.109/20 (position LAST → eth4; SimSpace-managed)
#
# Role: head of the OT Purdue chain. STATIC-ONLY at the L3.5 boundary
# (CLAUDE.md §3 row 8). No OSPF — never advertise OT prefixes into the
# corp IGP. No BGP. The corp side reaches OT via the static back-stop on
# bs-ops-fw (`172.16.0.0/16 → 172.31.1.18`); this router only needs a
# default back out toward bs-ops-fw.
ansible_host: "10.255.240.109"

network_interfaces:
  - name: "eth0"                     # switch-5 transit to bs-ops-fw (STATIC)
    ipv4:
      address: "172.31.1.18"
      netmask: "255.255.255.252"
      type: "ethernet"
  - name: "eth1"                     # Fuel-PLC OT segment gateway
    ipv4:
      address: "172.16.45.9"
      netmask: "255.255.255.248"
      type: "ethernet"
  - name: "eth2"                     # MTU (control-room) OT segment gateway
    ipv4:
      address: "172.16.45.1"
      netmask: "255.255.255.248"
      type: "ethernet"
  - name: "eth3"                     # Fuel-Sim OT segment gateway
    ipv4:
      address: "172.16.46.16"
      netmask: "255.255.255.0"
      type: "ethernet"

static_route:
  route: "0.0.0.0/0"
  next_hop: "172.31.1.17"            # bs-ops-fw (vmx4 SWITCH_5 .17)

# Strip image-baked self-loop defaults.
extra_static_routes_remove:
  - network: "0.0.0.0/0"
    next_hop: "172.16.45.9"          # own eth1 IP (Fuel-PLC)
  - network: "0.0.0.0/0"
    next_hop: "172.16.45.1"          # own eth2 IP (MTU)
  - network: "0.0.0.0/0"
    next_hop: "172.16.46.16"         # own eth3 IP (Fuel-Sim)

remove_vyos_bgp: true

# =========================================================================
# Security Onion GRE mirror — pairs with soc-sensor-ot
# =========================================================================
# Added 2026-08-11 with the SO blueprint additions. vyos_mirror builds a GRE
# tunnel to the sensor and installs `tc mirred` rules that copy each source
# interface into it. Suricata + Zeek on the sensor bind to tun0.
#
# ** VERIFY INTERFACE NUMBERING ON THE LIVE DEVICE FIRST. ** Blueprint NIC
# order did not match VyOS ethN on the so-ansible dev range
# (PORTING_GUIDE 9.9). `show interfaces` on bs-modbus-gateway and reconcile before
# deploying. The addresses below are drafted from this file's own
# network_interfaces, which is what the blueprint SHOULD produce.
#
# eth0 172.31.1.18 (to ops-fw) is the transit /30 -- deliberately NOT mirrored. Mirroring the transit that
# carries the tunnel is how you build a feedback loop.
vyos_mirror_source_interfaces:
  - eth1   # 172.16.45.9  Fuel Farm PLC /29
  - eth2   # 172.16.45.1  MTU / control-room-hmi /29
  - eth3   # 172.16.46.16  Fuel Farm Sim /24

# ** DRAFT — VERIFY. ** Must be an address on this router with a route to
# 172.31.7.0/24 (the sensors sit behind bs-sec-rtr behind bs-ops-fw). This
# value MUST equal so_gre_remote_underlay in host_vars/soc-sensor-ot.yml exactly;
# a mismatch gives a tunnel that is UP with zero RX forever.
vyos_gre_source_ip: "172.31.1.18"
vyos_gre_remote_ip: "172.31.7.23"      # soc-sensor-ot prod IP
vyos_gre_local_addr: "10.100.3.1"
vyos_gre_remote_addr: "10.100.3.2"
vyos_gre_tunnel_prefix: 30

# Do NOT mirror management-plane traffic. Where a mgmt IP shares a data-plane
# interface, a bare matchall mirror copies every Ansible SSH/WinRM session into
# the sensor -- out-of-band traffic that is invisible in-scenario and pollutes
# detections. Rendered as tc `action pass` filters ahead of the catch-all.
vyos_mirror_exclude_cidrs:
  - "10.255.240.0/20"
