---
# host_vars/soc-sensor-corp.yml — Security Onion SENSOR (Linux)
# Image:   global/RDP_Ubuntu_Desktop_22.04.5:1.1.0
# Prod:    SOC 172.31.7.21/24 → gw 172.31.7.1
# Mgmt:    10.255.240.183/20 (position FIRST → eth0)
# Mirrors: bs-core-rtr — Services 172.31.2.0/24, HQ .14, IT .15, Supply .16
ansible_host: "10.255.240.183"
network_interfaces:
  - name: "eth0"                     # mgmt (position FIRST)
    ipv4:
      type: "ethernet"
      address: "10.255.240.183"
      netmask: "255.255.240.0"
      gateway: ""
  - name: "eth1"                     # production — SOC 172.31.7.0/24
    ipv4:
      type: "ethernet"
      address: "172.31.7.21"
      netmask: "255.255.255.0"
      gateway: "172.31.7.1"
    dns:
      - "172.31.2.7"
      - "172.31.2.8"

# --- Security Onion role contract ----------------------------------------
so_role: "sensor"
so_hostname: "soc-sensor-corp"
so_prod_ip: "172.31.7.21"
so_prod_prefix: 24
so_prod_gateway: "172.31.7.1"
so_prod_dns:
  - "172.31.2.7"
  - "172.31.2.8"

# --- GRE mirror endpoint (pairs with bs-core-rtr) ---------------------------
# The /30 is arbitrary but must be unused and must match the router's
# vyos_gre_* values in host_vars/bs-core-rtr.yml.
so_gre_tunnel_local: "10.100.1.2"
so_gre_tunnel_remote: "10.100.1.1"
so_gre_tunnel_prefix: 30
so_monitor_interface: "tun0"

# The mirroring router's GRE endpoint -- the UNDERLAY remote, i.e. the source
# address the encapsulated packets actually arrive from. Drives BOTH the
# netplan tunnel's `remote:` and the sensor's SO firewall ACCEPT for proto 47.
#
# ** DRAFT — VERIFY ON bs-core-rtr BEFORE DEPLOYING. **
# It must be an address on that router with a route to 172.31.7.0/24. The
# sensors sit behind bs-sec-rtr, which sits behind bs-ops-fw, so the path
# differs per router and cannot be derived from host_vars. If this is wrong the
# kernel silently declines to decapsulate and tun0 reads 0 packets forever
# while showing UP -- so_sensor's "Verify the tunnel bound the CORRECT remote
# endpoint" check catches it, but only after a full deploy.
#
# PORTING TRAP: do NOT default this to so_prod_gateway. In the so-ansible dev
# range the mirroring router happened to BE the sensor's gateway, so three
# independent values agreed by coincidence and the bug stayed invisible until
# PowerPlant (ss-pp-ab UPSTREAM_FIXES 2026-08-04 later 3).
so_gre_remote_underlay: "172.31.1.9"   # bs-core-rtr, VERIFY

# --- 60-verify traffic targets -------------------------------------------
# Addresses the MANAGER pings so this sensor's mirror can be proven end to
# end. Which addresses force a router to forward out a MIRRORED interface is
# a per-router fact, so it lives here rather than in a shared default.
#
# NEVER a router's own .1 address. Those are locally delivered on the
# interface they arrive on and never egress a mirrored interface, where the
# `tc ... action mirred egress mirror` rules live -- so the tcpdump reports
# "0 packets captured" against a perfectly working mirror. That masked a real
# GRE firewall bug for several deploy cycles (PORTING_GUIDE 9.10).
#
# Unresponsive targets are fine: the router still ARPs out that interface and
# ARP frames are mirrored too.
#
# Coverage is deliberately partial -- these exercise some of this router's
# mirrored interfaces, enough to prove the whole chain (tc mirred -> GRE
# encap -> route to sensor -> firewall -> kernel decap -> tun0). A pass is
# NOT proof that every mirrored interface works.
so_verify_mirror_targets:
  - "172.31.2.7"       # bs-dc01      via bs-core-rtr eth1 (Services)
  - "172.31.14.11"     # bs-hq01      via bs-core-rtr eth2 (Headquarters)
  - "172.31.15.11"     # bs-it01      via bs-core-rtr eth3 (IT)
  - "172.31.16.11"     # bs-supply01  via bs-core-rtr eth4 (Supply)
