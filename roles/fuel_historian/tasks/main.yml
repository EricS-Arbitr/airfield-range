---
# fuel_historian -- Telegraf -> InfluxDB 2.7 -> Grafana on fuel-hist.
# CRITICAL: pin influxdb:2.7 (build sheet §13). `:latest` = InfluxDB 3
# Core (recent-data engine, ~72h window). Wrong for a historian.

# Docker CE from the Nexus per-release apt repo (configured by nexus_apt).
# docker.io is NOT in the Nexus repos; docker-ce is. Remove any distro docker.io
# first so the two do not conflict.
- name: Remove distro docker.io if present (conflicts with docker-ce)
  ansible.builtin.apt:
    name: docker.io
    state: absent

- name: Install Docker CE + python bindings
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - python3-docker
      - curl
      - ca-certificates
      - gnupg
    state: present
    update_cache: yes

- name: Ensure docker daemon running
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: yes

# --- InfluxDB 2.7 -----------------------------------------------------

# InfluxDB 2.7 container runs as uid 1000. Host bind mounts must be
# writable by that UID or the container crashes on init trying to
# create /var/lib/influxdb2 subdirs. `owner: 1000` chowns the host
# directory to that numeric UID -- works regardless of whether a
# matching user exists on the host.
- name: Directory for InfluxDB persistent state
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: '1000'
    group: '1000'
    mode: '0755'
  loop:
    - /opt/influxdb/data
    - /opt/influxdb/config

- name: Run InfluxDB 2.7 container (pinned)
  community.docker.docker_container:
    name: influxdb
    image: "{{ influxdb_image }}"   # influxdb:2.7 -- NEVER :latest
    restart_policy: unless-stopped
    published_ports:
      - "{{ fuel_hist_ip }}:8086:8086"
    volumes:
      - /opt/influxdb/data:/var/lib/influxdb2
      - /opt/influxdb/config:/etc/influxdb2
    env:
      DOCKER_INFLUXDB_INIT_MODE: "setup"
      DOCKER_INFLUXDB_INIT_USERNAME: "admin"
      DOCKER_INFLUXDB_INIT_PASSWORD: "{{ vault_influxdb_admin_password | default('Simspace1!Simspace1!') }}"
      DOCKER_INFLUXDB_INIT_ORG: "{{ influxdb_org }}"
      DOCKER_INFLUXDB_INIT_BUCKET: "{{ influxdb_bucket_fuel }}"
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: "{{ influxdb_admin_token }}"
    state: started
  register: influxdb_container

- name: Wait for InfluxDB API :8086 to answer
  ansible.builtin.wait_for:
    host: "{{ fuel_hist_ip }}"
    port: 8086
    timeout: 90

# --- Telegraf (polls ff-plc-1's SCADA-bus Modbus TCP server) ----------

# telegraf is served by the Nexus per-release apt repo (configured by nexus_apt).
# The InfluxData (repos.influxdata.com) internet repo is no longer added here --
# an airgapped range has no path to it, and the Nexus repo carries telegraf.
- name: Install telegraf (from the Nexus apt repo)
  ansible.builtin.apt:
    name: telegraf
    state: present
    update_cache: yes

- name: Render telegraf.conf with modbus input + influxdb v2 output
  ansible.builtin.template:
    src: telegraf.conf.j2
    dest: /etc/telegraf/telegraf.conf
    owner: telegraf
    group: telegraf
    mode: '0640'
  notify: restart telegraf

- name: Ensure telegraf running
  ansible.builtin.systemd:
    name: telegraf
    state: started
    enabled: yes

# --- Grafana ----------------------------------------------------------

# Grafana container runs as uid 472 -- see the "GF_PATHS_DATA is not
# writable" crash-loop we hit on 2026-07-16. Chown host bind mounts to
# 472:472. All four dirs get it: `data` and `dashboards` need write
# access (grafana writes plugin state + dashboard-live-edit files);
# provisioning dirs are read-only inside the container but keeping
# ownership uniform avoids surprise if the provisioning behavior ever
# changes to require write.
- name: Directory for Grafana persistent state + provisioning
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: '472'
    group: '472'
    mode: '0755'
  loop:
    - /opt/grafana/data
    - /opt/grafana/provisioning/datasources
    - /opt/grafana/provisioning/dashboards
    - /opt/grafana/dashboards

- name: Provision InfluxDB (Flux) + PostgreSQL datasources
  ansible.builtin.template:
    src: grafana_datasources.yml.j2
    dest: /opt/grafana/provisioning/datasources/fuel.yml
    mode: '0644'
  notify: restart grafana

- name: Dashboards provisioner index
  ansible.builtin.copy:
    dest: /opt/grafana/provisioning/dashboards/fuel.yml
    content: |
      apiVersion: 1
      providers:
        - name: 'fuel'
          orgId: 1
          folder: 'Fuel Farm'
          type: file
          disableDeletion: false
          options:
            path: /var/lib/grafana/dashboards
    mode: '0644'
  notify: restart grafana

- name: Placeholder fuel-operations dashboard (extend per build sheet §5)
  ansible.builtin.template:
    src: fuel_operations_dashboard.json.j2
    dest: /opt/grafana/dashboards/fuel_operations.json
    mode: '0644'
  notify: restart grafana

- name: Run Grafana container
  community.docker.docker_container:
    name: grafana
    image: grafana/grafana:11.2.0
    restart_policy: unless-stopped
    published_ports:
      - "{{ fuel_hist_ip }}:3000:3000"
    volumes:
      - /opt/grafana/data:/var/lib/grafana
      - /opt/grafana/provisioning:/etc/grafana/provisioning
      - /opt/grafana/dashboards:/var/lib/grafana/dashboards
    env:
      GF_SECURITY_ADMIN_USER: "admin"
      GF_SECURITY_ADMIN_PASSWORD: "{{ vault_grafana_admin_password | default('Simspace1!Simspace1!') }}"
    state: started

- name: Wait for Grafana UI :3000
  ansible.builtin.wait_for:
    host: "{{ fuel_hist_ip }}"
    port: 3000
    timeout: 90
