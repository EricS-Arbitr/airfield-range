---
# tar1090 — web radar scope on lighttpd, reading readsb's json. Config (config.js)
# is always Ansible-owned. Three install methods (atc_tar1090_install_method):
#   upstream_script — DEV, runs wiedehopf's installer over the internet.
#   bundled         — AIR-GAP, DEFAULT: runs that SAME upstream installer, but
#                     entirely offline — the app source is bundled in this role
#                     and passed as its local-source arg, the aircraft DB is
#                     pre-staged, and the one network version-check is patched to
#                     read the staged DB. lighttpd is a bundled .deb; git/jq/curl
#                     come from the Nexus apt repo. Jammy/amd64.
#   (any other)     — legacy placeholder, no-op.

- name: Install the web server (dev path; bundled path installs it from the bundle)
  ansible.builtin.apt:
    name: "{{ atc_tar1090_web }}"
    state: present
  when: atc_tar1090_install_method == "upstream_script"

# --- DEV: upstream install (wiedehopf tar1090) ------------------------------
- name: Fetch the upstream tar1090 installer (dev; range has egress)
  ansible.builtin.get_url:
    url: "{{ atc_tar1090_install_url }}"
    dest: /usr/local/src/tar1090-install.sh
    mode: "0755"
  environment:
    https_proxy: "{{ inet_proxy }}"
    http_proxy: "{{ inet_proxy }}"
  when: atc_tar1090_install_method == "upstream_script"

- name: Install tar1090 from upstream (reads readsb json; idempotent via creates)
  ansible.builtin.command: "bash /usr/local/src/tar1090-install.sh {{ atc_readsb_json_dir }}"
  args:
    creates: /usr/local/share/tar1090/html/index.html
  environment:
    https_proxy: "{{ inet_proxy }}"
    http_proxy: "{{ inet_proxy }}"
    DEBIAN_FRONTEND: noninteractive
  when: atc_tar1090_install_method == "upstream_script"

# --- AIR-GAP (bundled): run the upstream installer fully offline ------------
- name: ATC tar1090 (bundled) — git/jq/curl from Nexus apt (installer needs them present)
  ansible.builtin.apt:
    name: [git, jq, curl]
    state: present
    update_cache: false
  when: atc_tar1090_install_method == "bundled"

- name: ATC tar1090 (bundled) — stage the bundled .debs (lighttpd + readsb libs)
  ansible.builtin.copy:
    src: offline/debs/
    dest: /usr/local/src/atc-debs/
    mode: "0644"
  when: atc_tar1090_install_method == "bundled"

- name: ATC tar1090 (bundled) — ensure lighttpd from the bundle (deps from Nexus)  # noqa: command-instead-of-module
  ansible.builtin.shell: |
    set -o pipefail
    apt-get install -y /usr/local/src/atc-debs/lighttpd_*.deb 2>&1 | tail -10
  args:
    executable: /bin/bash
  register: atc_tar1090_lighttpd
  changed_when: "'0 newly installed' not in atc_tar1090_lighttpd.stdout"
  when: atc_tar1090_install_method == "bundled"

- name: ATC tar1090 (bundled) — unpack the app source
  ansible.builtin.unarchive:
    src: tar1090-src.tar.gz
    dest: /usr/local/src/
    creates: /usr/local/src/tar1090-master
  when: atc_tar1090_install_method == "bundled"

# Neutralise the ONE online version-check (the app fetch is skipped via the
# local-source arg; the DB getGIT already has `|| true`). Reading the staged
# DB's version makes DB_VERSION_NEW == staged, so the installer stays offline.
- name: ATC tar1090 (bundled) — patch the DB version-check to read the staged DB
  ansible.builtin.replace:
    path: /usr/local/src/tar1090-master/install.sh
    regexp: '^(\s*)DB_VERSION_NEW=\$\(curl .*\)$'
    replace: '\1DB_VERSION_NEW=$(cat "$gpath/git-db/version" 2>/dev/null || echo local)'
  when: atc_tar1090_install_method == "bundled"

- name: ATC tar1090 (bundled) — pre-stage the aircraft DB where the installer expects it
  ansible.builtin.unarchive:
    src: tar1090-db.tar.gz
    dest: /usr/local/share/tar1090/git-db/
    extra_opts: ['--strip-components=1']
    creates: /usr/local/share/tar1090/git-db/version
  when: atc_tar1090_install_method == "bundled"

- name: ATC tar1090 (bundled) — run the upstream installer offline (local source + staged DB)
  ansible.builtin.command:
    cmd: "bash /usr/local/src/tar1090-master/install.sh {{ atc_readsb_json_dir }} tar1090 /usr/local/share/tar1090 /usr/local/src/tar1090-master"
    creates: /usr/local/share/tar1090/html/index.html
  environment:
    DEBIAN_FRONTEND: noninteractive
  when: atc_tar1090_install_method == "bundled"

# --- Offline basemap tiles (served locally; hosts have no browser egress) ---
# Two methods (atc_tiles_method):
#   bundled (DEFAULT, air-gap): unpack the {z}/{x}/{y}.png tree bundled in
#     files/offline/tiles.tar.gz (ArcGIS World Imagery for the field's bbox,
#     staged 2026-11-20). No internet.
#   fetch (dev): download the tree from atc_tiles_src (ArcGIS) via the proxy.
- name: Ensure the local tiles directory exists
  ansible.builtin.file:
    path: "{{ atc_tar1090_tiles_dir }}"
    state: directory
    mode: "0755"
  when: atc_tar1090_offline_tiles | bool

- name: Unpack the bundled basemap tiles (air-gap; idempotent via creates)
  ansible.builtin.unarchive:
    src: offline/tiles.tar.gz
    dest: "{{ atc_tar1090_tiles_dir }}/"
    creates: "{{ atc_tar1090_tiles_dir }}/{{ atc_tiles_zoom_min }}"
  when:
    - atc_tar1090_offline_tiles | bool
    - atc_tiles_method == "bundled"

- name: Stage the tile fetcher (dev fetch path)
  ansible.builtin.copy:
    src: tiles/fetch_tiles.py
    dest: /usr/local/src/fetch_tiles.py
    mode: "0755"
  when:
    - atc_tar1090_offline_tiles | bool
    - atc_tiles_method == "fetch"

- name: Download the offline basemap tiles (dev fetch; idempotent via creates)
  ansible.builtin.command: >-
    /usr/bin/python3 /usr/local/src/fetch_tiles.py
    --src "{{ atc_tiles_src }}" --out "{{ atc_tar1090_tiles_dir }}"
    --lat-min {{ atc_tiles_bbox.lat_min }} --lat-max {{ atc_tiles_bbox.lat_max }}
    --lon-min {{ atc_tiles_bbox.lon_min }} --lon-max {{ atc_tiles_bbox.lon_max }}
    --zmin {{ atc_tiles_zoom_min }} --zmax {{ atc_tiles_zoom_max }}
  args:
    creates: "{{ atc_tar1090_tiles_dir }}/{{ atc_tiles_zoom_min }}"
  environment:
    https_proxy: "{{ inet_proxy }}"
    http_proxy: "{{ inet_proxy }}"
  when:
    - atc_tar1090_offline_tiles | bool
    - atc_tiles_method == "fetch"
    - atc_tiles_src | length > 0

# --- Config (Ansible-owned): center on the field + range rings --------------
- name: Configure tar1090 site location + range rings
  ansible.builtin.template:
    src: tar1090-config.js.j2
    dest: "{{ atc_tar1090_config }}"
    mode: "0644"
  notify: Restart tar1090
  when: atc_tar1090_config | length > 0

- name: Ensure tar1090 is enabled + running
  ansible.builtin.systemd:
    name: tar1090
    enabled: true
    state: started
    daemon_reload: true
  failed_when: false
