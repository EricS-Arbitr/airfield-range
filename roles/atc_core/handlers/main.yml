---
- name: Restart readsb
  ansible.builtin.systemd:
    name: readsb
    state: restarted
  failed_when: false

- name: Restart atc-fdp
  ansible.builtin.systemd:
    name: atc-fdp
    state: restarted
    daemon_reload: true

- name: Restart tar1090
  ansible.builtin.systemd:
    name: tar1090
    state: restarted
  failed_when: false
