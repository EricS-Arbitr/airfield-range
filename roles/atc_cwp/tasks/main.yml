---
# Kiosk display: a fullscreen browser on boot showing the FDP ops page
# (combined radar + strips — one page, not two tabs; design §2).

# Use the browser the Ubuntu Desktop image already ships. We do NOT
# `apt install firefox`: on 22.04 that package is the snap-transition deb, whose
# postinst pulls the Firefox snap from the store -- which fails in an airgapped
# range, and there is no browser package in the Nexus apt repos to use instead.
# The desktop image ships Firefox pre-installed, so the kiosk just launches it.
# Fail loudly (rather than ship a blank kiosk) if no browser is present.
- name: Confirm a kiosk browser is already installed (image-provided; nothing to fetch)
  ansible.builtin.shell: "command -v firefox || command -v chromium || command -v chromium-browser"
  register: atc_cwp_browser
  changed_when: false
  failed_when: atc_cwp_browser.rc != 0
  # If this fails, the Desktop image lacks a browser: stage one into the Nexus
  # apt repo (or the image) rather than reaching the internet.

- name: Create the autostart directory
  ansible.builtin.file:
    path: "/home/{{ atc_cwp_autologin_user }}/.config/autostart"
    state: directory
    owner: "{{ atc_cwp_autologin_user }}"
    group: "{{ atc_cwp_autologin_user }}"
    mode: "0755"

- name: Autostart the kiosk browser full-screen
  ansible.builtin.copy:
    dest: "/home/{{ atc_cwp_autologin_user }}/.config/autostart/atc-kiosk.desktop"
    owner: "{{ atc_cwp_autologin_user }}"
    group: "{{ atc_cwp_autologin_user }}"
    mode: "0644"
    content: |
      [Desktop Entry]
      Type=Application
      Name=ATC CWP Kiosk
      Exec=firefox --kiosk {{ atc_cwp_url }}
      X-GNOME-Autostart-enabled=true
  # TODO: suppress the GNOME initial-setup wizard (drop
  # ~/.config/gnome-initial-setup-done) like airfield-range does; confirm the
  # Desktop image autologins, or enable it here.
