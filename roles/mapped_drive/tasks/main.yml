- name: Create the GPO first
  ansible.windows.win_dsc:
    resource_name: GroupPolicy
    Name: "Mapped Network Drives"
    Ensure: Present

- name: Configure drive mapping registry value in GPO
  ansible.windows.win_dsc:
    resource_name: GPRegistryValue
    Name: "Mapped Network Drives"
    Key: "HKEY_CURRENT_USER\\Network\\{{ map_drive_letter }}"
    ValueName: "RemotePath"
    Value: "{{ map_drive_path }}"
    ValueType: String
    Ensure: Present

- name: Set provider name for drive mapping
  ansible.windows.win_dsc:
    resource_name: GPRegistryValue
    Name: "Mapped Network Drives"
    Key: "HKCU\\Network\\{{ map_drive_letter }}"
    ValueName: "ProviderName"
    Value: "Microsoft Windows Network"
    ValueType: String
    Ensure: Present

- name: Set provider type for drive mapping
  ansible.windows.win_dsc:
    resource_name: GPRegistryValue
    Name: "Mapped Network Drives"
    Key: "HKCU\\Network\\{{ map_drive_letter }}"
    ValueName: "ProviderType"
    Value: 20000
    ValueType: DWord
    Ensure: Present

- name: Set connection type for drive mapping
  ansible.windows.win_dsc:
    resource_name: GPRegistryValue
    Name: "Mapped Network Drives"
    Key: "HKCU\\Network\\{{ map_drive_letter }}"
    ValueName: "ConnectionType"
    Value: 1
    ValueType: DWord
    Ensure: Present

- name: Set connection flags for drive mapping
  ansible.windows.win_dsc:
    resource_name: GPRegistryValue
    Name: "Mapped Network Drives"
    Key: "HKCU\\Network\\{{ map_drive_letter }}"
    ValueName: "ConnectFlags"
    Value: 0
    ValueType: DWord
    Ensure: Present

- name: Set UserName for drive mapping
  ansible.windows.win_dsc:
    resource_name: GPRegistryValue
    Name: "Mapped Network Drives"
    Key: "HKCU\\Network\\{{ map_drive_letter }}"
    ValueName: "UserName"
    Value: 0
    ValueType: DWord
    Ensure: Present

- name: Set defer flags for drive mapping
  ansible.windows.win_dsc:
    resource_name: GPRegistryValue
    Name: "Mapped Network Drives"
    Key: "HKCU\\Network\\{{ map_drive_letter }}"
    ValueName: "DeferFlags"
    Value: 4
    ValueType: DWord
    Ensure: Present

- name: Enable drive mapping at login
  ansible.windows.win_dsc:
    resource_name: GPRegistryValue
    Name: "Mapped Network Drives"
    Key: "HKCU\\Software\\Microsoft\\Windows\\CurrentVersion\\Policies\\Explorer"
    ValueName: "NoDriveTypeAutoRun"
    Value: 145
    ValueType: DWord
    Ensure: Present

# New-GPLink directly rather than the DSC GPLink resource, because the DSC
# resource takes no -Domain or -Server and therefore resolves the target DN
# through the DC locator. On a child DC that lookup fails and the resource
# reports "The specified domain either does not exist or could not be
# contacted. (HRESULT 0x8007054B)" -- while every GroupPolicy and
# GPRegistryValue task above it succeeds on the same host in the same run.
# GPMC is fine; it is the locator call inside New-GPLink that is not.
#
# The 2026-07-08 entry recorded this as a fresh-child-DC warm-up quirk to be
# retried after 15 minutes. That is disproven: on 2026-09-18 it failed on
# attempts 2 AND 3 of a deploy, the last of them roughly six hours in.
#
# -Domain and -Server both pinned to this host removes the locator from the
# path: the DC being configured is the DC being asked.
#
# The domain DN is built from `domain_name` so it works at any depth:
#   blackstone.mil       -> DC=blackstone,DC=mil
#   fops.blackstone.mil  -> DC=fops,DC=blackstone,DC=mil
# The old `DC={{ short_domain_name }},DC={{ domain_tld_name }}` form only
# supported a single-label subdomain plus single-label TLD, and fops.yml sets
# no `domain_tld_name` because a child domain has no clean single-label value.
- name: Link GPO to the domain root
  ansible.windows.win_shell: |
    $ErrorActionPreference = 'Stop'
    Import-Module GroupPolicy
    $gpo    = "Mapped Network Drives"
    $target = "DC={{ domain_name.split('.') | join(',DC=') }}"
    $dom    = "{{ domain_name }}"
    $srv    = "$($env:COMPUTERNAME).$dom"
    $inh = Get-GPInheritance -Target $target -Domain $dom -Server $srv
    if ($inh.GpoLinks | Where-Object { $_.DisplayName -eq $gpo }) {
      Write-Output "GPLINK_PRESENT target=$target server=$srv"
    } else {
      New-GPLink -Name $gpo -Target $target -Domain $dom -Server $srv `
                 -LinkEnabled Yes -Enforced No -Order 1 | Out-Null
      Write-Output "GPLINK_CREATED target=$target server=$srv"
    }
  register: gplink
  changed_when: "'GPLINK_CREATED' in gplink.stdout"

- name: Report the GPO link state
  ansible.builtin.debug:
    msg: "{{ inventory_hostname }}: {{ gplink.stdout | trim }}"
