---
# dcpromo — promote a Windows Server to a Domain Controller.
#
# Two modes, driven by whether `parent_domain_name` is set for the host:
#
#   1. FOREST ROOT (parent_domain_name is NOT defined)
#      Uses microsoft.ad.domain to create a brand-new forest with the host
#      as its first DC. Example: bs-dc01 becomes the forest root for
#      blackstone.mil.
#
#   2. CHILD DOMAIN (parent_domain_name IS defined, e.g. fops.yml sets it
#      to "blackstone.mil")
#      Uses win_powershell to run Install-ADDSDomain -DomainType ChildDomain
#      because microsoft.ad.domain doesn't expose the ChildDomain flag as of
#      collection version 2.x. Example: fops-dc01 joins the existing
#      blackstone.mil forest as a child, giving fops.blackstone.mil with
#      automatic parent/child trust.
#
# Ordering: run this role against the forest root FIRST, then against the
# child domain DC. site.yml enforces this by splitting into two plays:
# `dcpromo (forest root)` targeting [pdc_blackstone], then `dcpromo (child
# domain)` targeting [pdc_fops].

- name: Install RSAT ADDS
  ansible.windows.win_feature:
    name: "rsat-ADDS"
    state: present
  register: rsat_adds

- name: Install RSAT DNS
  ansible.windows.win_feature:
    name: "rsat-DNS-Server"
    state: present
  register: rsat_dns

# DCPromo refuses to run while a servicing operation is pending, and says so:
#
#   Failed to install ADDSForest, DCPromo exited with 15: Role change is in
#   progress or this computer needs to be restarted.
#
# The two feature installs above are what leave it pending. Until 2026-09-19
# the only reboot-if-required task in this role was guarded
# `parent_domain_name is defined`, so it ran on the CHILD path only -- the
# forest root went straight from installing RSAT to promoting, with nothing
# between them, and neither install even registered a result for anything to
# check.
#
# This stayed invisible for as long as the base image happened to ship RSAT
# pre-installed: both tasks were no-ops, nothing was pending, and the promotion
# worked. The first image without it took the forest root down on all three
# deploy.sh attempts in 40 minutes, and with the forest root gone nothing
# downstream of AD could build.
#
# Registry keys, not just the module reports, because a pending reboot can also
# arrive from the image or from an earlier play. PendingFileRenameOperations is
# deliberately NOT checked -- it is set on most Windows hosts most of the time
# and would reboot every DC on every deploy.
- name: Check for a pending reboot before promotion
  ansible.windows.win_shell: |
    $pending = @()
    if (Test-Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Component Based Servicing\RebootPending') { $pending += 'CBS' }
    if (Test-Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\WindowsUpdate\Auto Update\RebootRequired') { $pending += 'WindowsUpdate' }
    if (Test-Path 'HKLM:\SYSTEM\CurrentControlSet\Control\ServerManager\CurrentRebootAttempts') { $pending += 'ServerManager' }
    if ($pending.Count -eq 0) {
      Write-Output "REBOOT_NOT_PENDING"
    } else {
      Write-Output ("REBOOT_PENDING " + ($pending -join ','))
    }
  register: dcpromo_pending_reboot
  changed_when: false

- name: Reboot before promotion if a role change is pending
  ansible.windows.win_reboot:
    reboot_timeout: 900
  when: >-
    (rsat_adds.reboot_required | default(false)) or
    (rsat_dns.reboot_required | default(false)) or
    ('REBOOT_PENDING' in (dcpromo_pending_reboot.stdout | default('')))

- name: Report the pre-promotion reboot decision
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }}: {{ dcpromo_pending_reboot.stdout | default('(no probe)') | trim }}
      rsat_adds_reboot={{ rsat_adds.reboot_required | default(false) }}
      rsat_dns_reboot={{ rsat_dns.reboot_required | default(false) }}

- name: local admin guest customization fix - Server 2019
  ansible.windows.win_shell: "net user administrator /passwordreq:yes"

- name: local admin guest customization fix - Server 2022
  ansible.windows.win_user:
    name: administrator
    password: "{{ domain_admin_password }}"
    password_never_expires: yes
    account_disabled: no

# --- Mode 1: forest root ----------------------------------------------------
- name: Create forest root domain (this host becomes first DC)
  microsoft.ad.domain:
    dns_domain_name: "{{ domain_name }}"
    safe_mode_password: "{{ domain_admin_password }}"
  register: dcpromo_forest
  notify: Reboot Windows
  when: parent_domain_name is not defined

# --- Mode 2: child domain ---------------------------------------------------
# The child-domain DC needs to reach the parent forest root via DNS to
# authenticate the domain creation. We set the mgmt IP's primary DNS to
# point at the forest root's public IP before running Install-ADDSDomain,
# so name resolution + LDAP find the parent.
#
# `Install-ADDSDomain -DomainType ChildDomain` takes:
#   -NewDomainName <label-only>    (e.g. "fops" for fops.blackstone.mil)
#   -ParentDomainName <parent FQDN> (e.g. "blackstone.mil")
#   -Credential <Enterprise Admin> (parent-forest admin required)
#
# We derive NewDomainName from domain_name by stripping the parent suffix.
- name: Compute child-domain label from domain_name minus parent_domain_name
  ansible.builtin.set_fact:
    child_domain_label: "{{ domain_name | regex_replace('\\.' + (parent_domain_name | regex_escape) + '$', '') }}"
  when: parent_domain_name is defined

# `Install-ADDSDomain` lives in the ADDSDeployment PowerShell module, which
# only ships once the AD-Domain-Services Windows Feature is installed. The
# forest-root path uses microsoft.ad.domain which auto-installs the feature;
# the child-domain path uses win_powershell directly, so we have to install
# it explicitly here. `include_management_tools: true` gives us the RSAT-ADDS
# module bundle as well (superset of the `rsat-ADDS` install at the top of
# this role, but idempotent -- ok to double-install).
- name: Install AD-Domain-Services + management tools (child-domain path)
  ansible.windows.win_feature:
    name: AD-Domain-Services
    state: present
    include_management_tools: true
  register: adds_feature_install
  when: parent_domain_name is defined

- name: Reboot if AD-Domain-Services install requires it
  ansible.windows.win_reboot:
  when:
    - parent_domain_name is defined
    - adds_feature_install.reboot_required | default(false)

- name: Check if host is already a DC for {{ domain_name | default('') }}
  ansible.windows.win_shell: |
    $cs = Get-WmiObject Win32_ComputerSystem
    if ($cs.PartOfDomain -and $cs.Domain -eq '{{ domain_name }}') { 'ALREADY_JOINED' } else { 'NEEDS_PROMOTION' }
  register: child_dc_state
  # no_log: the command embeds domain_admin_password. Pure probe -- its output
  # drives a conditional and nothing reports it, so nothing is lost.
  no_log: true
  changed_when: false
  when: parent_domain_name is defined

# Install-ADDSDomain for a child domain needs a credential that is a member
# of BOTH Enterprise Admins AND Domain Admins in the parent forest (creating
# a new domain modifies the Partitions container in the Configuration NC and
# also alters the parent-forest schema replication topology). The parent's
# built-in `Administrator` is automatically in both groups (plus Schema
# Admins) as soon as microsoft.ad.domain finishes on bs-dc01, and its
# password is preserved from the local Administrator -- which the
# "local admin guest customization fix" tasks above already reset to
# `domain_admin_password` (= Simspace1!Simspace1!). So we hard-code the
# credential to `{{ parent_domain_name }}\Administrator` for Install-ADDSDomain.
# This replaces an earlier "grant EA to simspace" dance that was fragile
# because it depended on `simspace` existing as an AD user BEFORE
# create_users had run on bs-dc01 (create_users runs after dcpromo(child)
# in site.yml -- and reordering it caused other chicken-and-egg problems).
# See UPSTREAM_FIXES.md 2026-07-08.

# Chicken-and-egg: Install-ADDSDomain needs to resolve
# _ldap._tcp.{{ parent_domain_name }} SRV records to find the parent
# forest DC to authenticate against. But fops-dc01's default primary DNS
# is set to itself + sibling (both fops.blackstone.mil DCs), neither of
# which can answer for blackstone.mil until child promotion completes.
# So we point primary DNS at the parent PDC (bs-dc01) for the duration
# of promotion. After Install-ADDSDomain finishes + reboot, fops-dc01 is
# itself a DC and hosts fops.blackstone.mil; a later play can restore
# the intended DNS if needed. See UPSTREAM_FIXES.md 2026-07-07.
- name: Point primary DNS at parent PDC before Install-ADDSDomain
  # Selection strategy (in order):
  #   1. Interface carrying the default route (== prod NIC per airfield
  #      contract: mgmt NIC has empty gateway).
  #   2. First IPv4 interface whose DNS is already populated (post-`common`
  #      steady state).
  #   3. Any non-loopback/non-tunnel IPv4 interface (last-resort so we set
  #      SOMETHING rather than emit NO_IFACE_FOUND — matches the case where
  #      dcpromo runs against a baseline-image host with no DNS yet).
  # Previous logic ("first with DNS set") failed silently on tag-limited
  # runs (`--tags dcpromo_child` skips `common`) and on baseline
  # snapshot-reverted hosts, producing NO_IFACE_FOUND → Install-ADDSDomain
  # then died with "domain controller for blackstone.mil could not be
  # contacted." See UPSTREAM_FIXES.md 2026-07-10.
  ansible.windows.win_shell: |
    $iface = $null
    $defRoute = Get-NetRoute -DestinationPrefix '0.0.0.0/0' -ErrorAction SilentlyContinue |
      Sort-Object -Property RouteMetric | Select-Object -First 1
    if ($defRoute) {
      $iface = Get-DnsClientServerAddress -InterfaceIndex $defRoute.InterfaceIndex -AddressFamily IPv4 -ErrorAction SilentlyContinue
    }
    if (-not $iface) {
      $iface = Get-DnsClientServerAddress -AddressFamily IPv4 |
        Where-Object { $_.ServerAddresses.Count -gt 0 } |
        Select-Object -First 1
    }
    if (-not $iface) {
      $iface = Get-DnsClientServerAddress -AddressFamily IPv4 |
        Where-Object { $_.InterfaceAlias -notmatch 'Loopback|isatap|Teredo|Tunnel' } |
        Sort-Object InterfaceIndex |
        Select-Object -First 1
    }
    if ($iface) {
      Set-DnsClientServerAddress `
        -InterfaceIndex $iface.InterfaceIndex `
        -ServerAddresses '{{ parent_domain_pdc_ip }}','8.8.8.8'
      Clear-DnsClientCache
      "SET_DNS_OK:$($iface.InterfaceAlias)"
    } else { "NO_IFACE_FOUND" }
  register: parent_dns_set
  changed_when: "'SET_DNS_OK' in parent_dns_set.stdout"
  failed_when: "'NO_IFACE_FOUND' in parent_dns_set.stdout"
  when:
    - parent_domain_name is defined
    - "'NEEDS_PROMOTION' in child_dc_state.stdout"

- name: Create child domain (this host becomes first DC of {{ domain_name | default('') }})
  ansible.windows.win_powershell:
    script: |
      $ErrorActionPreference = 'Stop'
      # Persistent disk log -- survives WinRM session death and reboots so we
      # can recover the actual Install-ADDSDomain output even if this task
      # returns UNREACHABLE mid-flight (a known symptom on Server 2022 where
      # promotion changes local auth state and severs the caller's session).
      # Retrieve via bs-dc01 SMB after the fact:
      #   ansible bs-dc01 ... 'Get-Content \\172.31.3.11\c$\ProgramData\dcpromo-install.log'
      $log = 'C:\ProgramData\dcpromo-install.log'
      $null = New-Item -ItemType Directory -Path 'C:\ProgramData' -Force -ErrorAction SilentlyContinue
      "$(Get-Date -Format o) START Install-ADDSDomain child={{ child_domain_label }} parent={{ parent_domain_name }}" | Add-Content $log

      Import-Module ADDSDeployment -ErrorAction Stop
      $pw = ConvertTo-SecureString '{{ domain_admin_password }}' -AsPlainText -Force
      # Credential = parent-forest built-in Administrator. Auto-EA + auto-DA
      # + Schema Admin as soon as microsoft.ad.domain finishes on the forest
      # root. Password preserved from local Administrator (which the local
      # admin fix tasks above reset to `domain_admin_password`).
      $cred = New-Object System.Management.Automation.PSCredential(
        '{{ parent_domain_name }}\Administrator', $pw)
      try {
        $result = Install-ADDSDomain `
          -NewDomainName '{{ child_domain_label }}' `
          -ParentDomainName '{{ parent_domain_name }}' `
          -DomainType ChildDomain `
          -DomainMode 'WinThreshold' `
          -InstallDns `
          -Credential $cred `
          -SafeModeAdministratorPassword $pw `
          -Force -NoRebootOnCompletion -ErrorAction Stop
        "$(Get-Date -Format o) RESULT Status=$($result.Status) Message=$($result.Message)" | Add-Content $log
        if ($result.Status -eq 'Success') {
          "$(Get-Date -Format o) DCPROMO_OK" | Add-Content $log
          $Ansible.Changed = $true
          # REBOOT FROM INSIDE THIS SESSION. Install-ADDSDomain sets the
          # machine's domain hint as part of its work, so from this moment on
          # the credentials that opened this WinRM session are the only ones
          # that still work -- and only until the session closes.
          #
          # This task used to pass -NoRebootOnCompletion and `notify: Reboot
          # Windows`. The handler ran AFTER the session closed, could not
          # authenticate, and returned "rebooted": false. The promotion was
          # written to disk and never finalized, leaving the machine
          # half-joined on every single deploy (2026-08-10, three ranges).
          #
          # shutdown.exe launches a detached system process scheduled 15s out,
          # fully decoupled from WinRM -- the same technique dcpromo_child_heal
          # uses, and for the same reason (Start-Job children die with the
          # parent shell, so the reboot never fires).
          "$(Get-Date -Format o) SCHEDULING REBOOT (detached, 15s)" | Add-Content $log
          & shutdown.exe /r /t 15 /f /c "dcpromo: finalizing child-domain promotion"
          Write-Output "PROMOTION_OK REBOOT_SCHEDULED"
        } else {
          "$(Get-Date -Format o) DCPROMO_FAILED status=$($result.Status)" | Add-Content $log
          $Ansible.Failed = $true
          Write-Output "PROMOTION_FAILED status=$($result.Status) msg=$($result.Message)"
        }
      } catch {
        "$(Get-Date -Format o) DCPROMO_EXCEPTION: $($_.Exception.Message)" | Add-Content $log
        "$(Get-Date -Format o) STACK: $($_.ScriptStackTrace)" | Add-Content $log
        $Ansible.Failed = $true
        Write-Output "PROMOTION_EXCEPTION: $($_.Exception.Message)"
        Write-Output "STACK: $($_.ScriptStackTrace)"
      }
  register: dcpromo_child
  # no_log: the command embeds domain_admin_password and Ansible echoes `cmd`
  # on failure. Diagnosis is not lost -- this task writes its own transcript to
  # C:\ProgramData\dcpromo-install.log, which the post-dcpromo snapshot play
  # collects, and that log is where the useful detail already lived.
  no_log: true
  # NO `notify: Reboot Windows`. The handler cannot authenticate after this
  # task -- that is the defect, not a timing quirk. The reboot is fired
  # in-session above.
  when:
    - parent_domain_name is defined
    - "'NEEDS_PROMOTION' in child_dc_state.stdout"

# The machine comes back as a DC of the child domain, where the former local
# Administrator is now the domain Administrator. Unqualified `simspace` will
# NOT work here and neither will MACHINE\Administrator -- the local SAM is
# gone once promotion finalizes.
#
# Fatal on purpose. If this credential is wrong, everything downstream fails
# in confusing ways (the bootstrap play reports "ADWS not running", which
# looks like a service problem rather than an auth one). Better to say so here.
- name: Wait for the child DC to finish promoting and come back
  vars:
    ansible_user: "{{ (domain_name | regex_replace('\\..*$','')) | upper }}\\Administrator"
    ansible_password: "{{ domain_admin_password }}"
  ansible.builtin.wait_for_connection:
    delay: 60
    sleep: 15
    timeout: 900
  # `is not skipped`, not `is changed`. The promotion task reboots from inside
  # its own session, so it can return unreachable or failed rather than
  # changed -- and those are precisely the runs where waiting for the host to
  # come back matters most. `is changed` skipped the wait in exactly the case
  # it was written for.
  when:
    - parent_domain_name is defined
    - dcpromo_child is defined
    - not (dcpromo_child is skipped)

- name: Confirm AD services are actually running on the new child DC
  vars:
    ansible_user: "{{ (domain_name | regex_replace('\\..*$','')) | upper }}\\Administrator"
    ansible_password: "{{ domain_admin_password }}"
  ansible.windows.win_powershell:
    script: |
      $Ansible.Changed = $false
      $want = @('ADWS', 'NTDS', 'Netlogon')
      $bad = @()
      foreach ($n in $want) {
        $s = Get-Service -Name $n -ErrorAction SilentlyContinue
        if (-not $s) {
          $bad += "$n=MISSING"
        } elseif ($s.Status -ne 'Running') {
          $bad += "$n=$($s.Status)"
        }
      }
      if ($bad.Count -eq 0) {
        Write-Output "CHILD_DC_SERVICES_OK"
      } else {
        Write-Output ("CHILD_DC_SERVICES_BAD " + ($bad -join ' '))
      }
  register: child_dc_services
  # The old probe counted services whose Status was not Running. When
  # Get-Service found NOTHING -- the services absent entirely, which is what a
  # failed promotion actually looks like -- the count was 0 and the host was
  # declared healthy. It reported the worst case as the best one. Name each
  # service and distinguish MISSING from Stopped.
  #
  # Retries because this runs right after a reboot: NTDS and ADWS take time to
  # start, and sampling once turns a slow start into a failure.
  until: "'CHILD_DC_SERVICES_OK' in (child_dc_services.output | default([]) | join(' '))"
  retries: 20
  delay: 15
  changed_when: false
  # no_log: the command embeds domain_admin_password and Ansible echoes `cmd`
  # on failure. The DIAGNOSIS is preserved by the task below, which prints the
  # probe output and never the command -- same pattern as elastic_agent.
  no_log: true
  failed_when: false

- name: Fail if AD services did not come up on the new child DC
  ansible.builtin.fail:
    msg: |
      AD services are not running on {{ inventory_hostname }} after promotion.
      probe output: {{ child_dc_services.output | default(['(none)']) | join(' ') }}

      MISSING means the service does not exist on the host, which is what a
      failed promotion looks like -- not a slow start. Check
      C:\ProgramData\dcpromo-install.log, which the post-dcpromo snapshot
      play collects.

      The credential is not shown. Read the play if you need the command.
  # ONE `when`, deliberately. This task carried two until 2026-09-18: a bare
  # `when:` with the service condition, followed by a `when:` list with the
  # guards. YAML keeps the last key and silently drops the first, so the
  # service condition -- the entire point of the task -- was never evaluated,
  # and `child_dc_services` was probed above and then read by nothing but the
  # message string. Ansible reports this as a construction WARNING, which
  # scrolls past in a 26,000-line deploy log.
  when:
    - parent_domain_name is defined
    - dcpromo_child is defined
    - not (dcpromo_child is skipped)
    - "'CHILD_DC_SERVICES_OK' not in (child_dc_services.output | default([]) | join(' '))"
