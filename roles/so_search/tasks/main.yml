---
# =========================================================================
# so_search — join manager as SEARCHNODE
# =========================================================================
# Structurally identical to so_manager except for template + answer name.
# Kept as its own role (rather than parameterizing so_manager) so future
# per-role divergence (heap-tuning, disk layout, etc.) is trivial to add.

# --- LIFETIME INVARIANT: this node's entry in the manager's firewall -------
# Moved above the `meta: end_host` probe 2026-08-05 (structural pass 3/5).
#
# This is MANAGER-SIDE state, not node-side. The node being installed says
# nothing about whether the manager still lists it: a rebuilt manager, a
# restored pillar, or a hand-edited hostgroup all leave an installed node
# permanently unable to reach salt on 4505/4506, and the old ordering meant
# a re-run could never repair it -- the play ended at the probe first.
#
# Cheap on re-runs: `so-firewall includehost` reports "already exists" (rc=3)
# and is not `changed`, so the expensive apply below is skipped entirely.
- name: Preflight — confirm this role is running with escalated privilege
  ansible.builtin.command: id -u
  register: _role_euid
  changed_when: false

# so_search carries no task-level `become`: it relies entirely on the calling
# play supplying `become: true`. That contract is invisible until a task
# fails on a permission error somewhere in the middle, which is an expensive
# way to learn it -- on this project every such discovery costs a
# build/upload/deploy round trip through a web console.
#
# Two `become` mistakes on 2026-08-04/05 came from exactly this ambiguity:
# a play-level become that broke an unprivileged chmod, then removing it
# entirely and breaking a privileged remote read. State the requirement and
# fail on it immediately.
- name: Fail immediately if so_search was invoked without become
  ansible.builtin.fail:
    msg: >-
      so_search requires privilege escalation but is running as uid
      {{ _role_euid.stdout | trim }}. Add `become: true` to the play that
      invokes it. Every task in this role assumes root; without it you get a
      permission error partway through, in a task that looks unrelated.
  when: (_role_euid.stdout | trim) != '0'

- name: Grid join — on manager, add this node's IP to searchnode firewall hostgroup
  ansible.builtin.command: "sudo /usr/sbin/so-firewall includehost searchnode {{ so_prod_ip }}"
  delegate_to: "{{ groups['so_manager'][0] }}"
  become: true
  register: fw_add
  changed_when: "'Successfully added' in fw_add.stdout"
  # so-firewall returns rc=3 with 'WARNING - IP ... already exists in hostgroup ...' when
  # the IP was already added by a previous attempt. That's idempotent, not a failure.
  failed_when:
    - fw_add.rc != 0
    - "'already exists' not in fw_add.stderr"

- name: Grid join — on manager, apply firewall state (opens 4505/4506 for this node)
  ansible.builtin.command: sudo salt-call state.apply firewall queue=True
  delegate_to: "{{ groups['so_manager'][0] }}"
  become: true
  register: fw_apply
  changed_when: fw_apply.rc == 0
  # `queue=True` is the fix for the highstate collision, not the retries.
  # Without it salt refuses outright -- "The function state.highstate is
  # running as PID X" -- and the retry loop just burns its budget failing in
  # 7 seconds a time. On PowerPlant 2026-08-04 that emptied all 20 retries in
  # ~12 min while the highstate was still going. queue=True makes salt hold
  # the job until the running state finishes, so this call BLOCKS (possibly
  # 20+ min) rather than failing. Retries are now only for a genuinely
  # unreachable master. See UPSTREAM_FIXES 2026-08-04 (highstate lock).
  until: fw_apply.rc == 0
  retries: 40
  delay: 30
  # Gate on the EXIT CODE, not on `changed`. rc=0 means the entry was added;
  # rc=3 is "already exists". Keying off `changed` would couple this to
  # `changed_when`'s stdout string-match, so a reworded so-firewall message
  # would silently skip the apply on a FRESH node and leave 4505/4506 shut --
  # the failure would surface much later as a grid join that never completes.
  when: fw_add.rc == 0

- name: Idempotency probe
  ansible.builtin.stat:
    path: "{{ so_search_installed_marker }}"
  register: so_installed

- name: End play early on this host if SO is already installed
  ansible.builtin.meta: end_host
  when: so_installed.stat.exists

- name: Precondition — SO source must be at {{ so_source_dest }}
  ansible.builtin.stat:
    path: "{{ so_source_dest }}/setup/so-setup"
  register: so_setup_present

- name: Fail loudly if so_base didn't stage the source
  ansible.builtin.fail:
    msg: |
      SO source missing at {{ so_source_dest }}/setup/so-setup. Re-run 30-prereqs.
  when: not so_setup_present.stat.exists

- name: Gather network facts (need per-iface ipv4)
  ansible.builtin.setup:
    gather_subset:
      - network

- name: Compute so_prod_nic
  ansible.builtin.set_fact:
    so_prod_nic: >-
      {{ (ansible_facts['interfaces']
          | map('regex_replace', '-', '_')
          | map('extract', ansible_facts)
          | selectattr('ipv4', 'defined')
          | selectattr('ipv4.address', 'equalto', so_prod_ip)
          | map(attribute='device')
          | list
          | first) }}

- name: Compute so_prod_netmask
  ansible.builtin.set_fact:
    so_prod_netmask: >-
      {{ {16:'255.255.0.0', 20:'255.255.240.0', 22:'255.255.252.0',
          23:'255.255.254.0', 24:'255.255.255.0', 25:'255.255.255.128',
          26:'255.255.255.192', 27:'255.255.255.224', 28:'255.255.255.240',
          29:'255.255.255.248', 30:'255.255.255.252',
          31:'255.255.255.254', 32:'255.255.255.255'
      }[so_prod_prefix | int] }}

- name: Render search answer file to /root/so-answers.env
  ansible.builtin.template:
    src: search.env.j2
    dest: /root/so-answers.env
    mode: '0600'
    owner: root
    group: root

# --- so-setup skip decision (POSITIVE proof, not just an exit code) ------
# 2026-07-28: the old design gated the shell task on `creates: <marker>`
# and treated rc=0 as proof of success. That is self-perpetuating and
# unsafe: when `creates:` is satisfied, Ansible's command module returns
# rc=0 WITH skipped=true, so the "fail if rc != 0" guard below passes
# whether so-setup succeeded OR was skipped — and then we re-touch the
# marker. Once the marker exists for ANY reason the node can never
# self-heal, because the only task that would repair it is the one being
# skipped. so-sensor-1 landed in exactly that state (marker present, no
# /root/so-setup.log, no Salt installed at all, no key on the master).
#
# Fix: skip so-setup only when the marker exists AND Salt is genuinely
# present. Either condition alone is insufficient — the marker alone is
# the bug above, and Salt alone would skip a so-setup that installed Salt
# then died before finishing.
# NOTE: do NOT probe /etc/salt/minion_id — this SO version never writes
# it. It sets `id:` inside /etc/salt/minion instead (verified 2026-07-28:
# /etc/salt/ held grains, minion, minion.d/, pki/ but no minion_id, while
# the minion was correctly identifying as so-sensor-1_sensor). Probing
# minion_id made so_setup_can_skip permanently false, which would re-run
# 30-45 min of so-setup on every attempt forever.
- name: Probe for a real Salt install (minion config written by so-setup)
  ansible.builtin.stat:
    path: /etc/salt/minion
  register: salt_minion_id

- name: Probe for the salt-minion systemd unit
  ansible.builtin.command: systemctl list-unit-files salt-minion.service
  register: salt_unit_probe
  changed_when: false
  failed_when: false

- name: Probe for the so-setup completion marker
  ansible.builtin.stat:
    path: "{{ so_search_setup_marker }}"
  register: so_setup_marker_stat

- name: Decide whether the 30-45 min so-setup call can be skipped
  ansible.builtin.set_fact:
    so_setup_can_skip: >-
      {{ so_setup_marker_stat.stat.exists
         and salt_minion_id.stat.exists
         and 'salt-minion.service' in salt_unit_probe.stdout }}

- name: Report so-setup skip decision
  ansible.builtin.debug:
    msg: >-
      so-setup {{ 'SKIPPED (marker + Salt both present)' if so_setup_can_skip
      else 'WILL RUN' }} — marker={{ so_setup_marker_stat.stat.exists }},
      minion_id={{ salt_minion_id.stat.exists }},
      unit={{ 'salt-minion.service' in salt_unit_probe.stdout }}

- name: Kick off so-setup network (bash-source env then invoke)
  ansible.builtin.shell: |
    # START FROM A CLEAN SLATE, AND KEEP THE EVIDENCE.
    # The redirect below truncates the log, so the previous attempt's log is
    # moved aside first -- attempt 1's 4.4 MB log was destroyed by attempt 2's
    # kickoff on 2026-09-28, which is exactly when it was needed. SO's own
    # markers are cleared too: a /root/failure left by the previous attempt made
    # the poll report THAT attempt's outcome instead of this one's.
    [ -f {{ so_search_setup_log }} ] && mv -f {{ so_search_setup_log }} {{ so_search_setup_log }}.prev
    [ -f /root/errors.log ] && mv -f /root/errors.log /root/errors.log.prev
    rm -f /root/.so-setup-progress /root/failure
    source /root/so-answers.env
    cd {{ so_source_dest }}/setup
    ./so-setup {{ so_setup_type }} > {{ so_search_setup_log }} 2>&1
  args:
    executable: /bin/bash
  async: "{{ so_search_install_timeout }}"
  poll: 0
  register: so_setup_async
  when: not so_setup_can_skip

# so-setup is supervised on PROGRESS, not on a deadline.
#
# MEASURED 2026-09-27 on ss-pp-so. The old poll was `async_status` with
# `until: finished`, which can only answer "finished" or "not finished" -- a
# wedged install and a slow one look identical for the entire window. Worse, that
# window was also the KILL: `async: so_search_install_timeout` makes Ansible's wrapper
# terminate the job when it expires. At 5400s so-setup was working normally --
# no /root/failure, no /root/errors.log, steady salt states completing, already
# at so-elastic-fleet-optional-integrations-load -- and was killed mid-step.
# so_search_setup_marker was therefore never written, so the next attempt restarted
# from zero and was killed at 90 minutes again. Three attempts, 4.5 hours, all
# discarded, and the log reported nothing wrong because nothing was wrong.
#
# So the deadline is a backstop now, not a policy, and lack of progress is what
# fails the run: if the log stops growing for so_search_stall_seconds, or so-setup
# vanishes without writing the marker, this fails IMMEDIATELY with the log tail.
# A slow install gets to finish; a wedged one is caught in 15 minutes, not 90.
#
# /root/failure and the completion marker are so-setup's OWN signals and outrank
# anything inferred from the log or from the exit code, which is not trustworthy
# (2026-07-28: it logged a fatal error and still exited 0).
- name: Poll so-setup — done, progressing, or stalled
  ansible.builtin.shell: |
    set -u
    log="{{ so_search_setup_log }}"
    marker="{{ so_search_setup_marker }}"
    state=/root/.so-setup-progress
    stall={{ so_search_stall_seconds }}
    now=$(date +%s)
    size=$(stat -c %s "$log" 2>/dev/null || echo 0)

    # THE COMPLETION MARKER OUTRANKS /root/failure, and /root/failure is not by
    # itself a verdict. UPSTREAM_FIXES 2026-07-28: so-setup writes that marker for
    # benign cleanup noise -- an elastic-agent "notify Fleet: failed" logged while
    # Fleet is still coming up -- which is why this role reports it as a WARNING
    # further down and judges success by the Salt and so-status checks instead.
    # The first version of this poll checked it FIRST and treated it as fatal,
    # contradicting that, and worse: a marker left by a PREVIOUS attempt decided
    # the next one before so-setup had done anything. Measured 2026-09-28 on
    # ss-pp-so -- attempt 1 failed 4.4 MB into the log, attempts 2 and 3 then
    # returned SOSETUP_FAILED at 19 and 72 bytes off the stale marker.
    if [ -f "$marker" ]; then echo "SOSETUP_DONE size=${size}"; exit 0; fi

    # PROGRESS IS NOT JUST LOG BYTES. so-setup has late phases that produce no
    # output for a long time while salt works underneath it, so a silent log says
    # nothing about whether anything is happening. MEASURED 2026-09-28 on
    # ss-pp-so: three attempts all reported STALLED at ~4.12 MB after 910s of
    # silence, and an earlier run had reached 4,128,013 bytes -- about a kilobyte
    # further -- and then logged "Done [59s]". The install was working; the
    # detector was measuring the wrong thing.
    #
    # CPU time across the so-setup and salt processes is the second signal. A
    # wedged process consumes none; a working-but-quiet one does. Progress is
    # EITHER the log growing OR that counter advancing, so a silent phase doing
    # real work no longer looks like a hang.
    cpu=$(ps -eo cputimes=,args= 2>/dev/null |
          awk '/[s]o-setup|[s]alt-call|[s]alt-minion|[s]alt-master/ { s += $1 } END { print s+0 }')
    [ -n "$cpu" ] || cpu=0
    fp="${size}:${cpu}"

    prev_fp=""; prev_time=$now
    if [ -s "$state" ]; then read -r prev_fp prev_time < "$state" || true; fi
    [ -n "$prev_fp" ] || prev_fp=""
    [ -n "$prev_time" ] || prev_time=$now
    if [ "$fp" != "$prev_fp" ]; then
      printf '%s %s\n' "$fp" "$now" > "$state"
      prev_time=$now
    fi
    idle=$(( now - prev_time ))

    # [s] so pgrep does not match its own command line.
    if pgrep -f '[s]o-setup' >/dev/null 2>&1; then
      if [ "$idle" -ge "$stall" ]; then echo "SOSETUP_STALLED idle=${idle}s size=${size} cpu=${cpu}"
      else echo "SOSETUP_RUNNING idle=${idle}s size=${size} cpu=${cpu}"; fi
    else
      # THE PROCESS EXITED. That is ALL this poll is competent to say, and all it
      # needs to say. Whether so-setup actually WORKED is decided by the four
      # checks that already follow: the /root/failure warning, Salt installed,
      # the registry repo count, and so-status green. Those test what the next
      # step needs; this only tests whether the thing is still running.
      #
      # This poll used to claim more. It waited for {{ so_search_setup_marker }} to appear -- but
      # that marker is written by THIS ROLE about twelve tasks further down, as a
      # record that the verification passed. It cannot exist while the poll is
      # still running, so SOSETUP_DONE was unreachable on any first install and
      # the run ended in a verdict of failure no matter how well so-setup had
      # gone. Measured 2026-09-28 on ss-pp-so: so-setup logged "Done [59s]",
      # so-status reported all 14 containers up and "ready to make your
      # adversaries cry", and the play had already been failed by this task.
      echo "SOSETUP_FINISHED idle=${idle}s size=${size}"
    fi
  args:
    executable: /bin/bash
  register: so_setup_poll
  # Requires a RECOGNISED verdict, not merely the absence of SOSETUP_RUNNING. A
  # transient failure of this task -- attempt 2 hit "Timeout (12s) waiting for
  # privilege escalation prompt" when the host was pinned -- leaves stdout empty,
  # and an empty string does not contain SOSETUP_RUNNING either. Keying on absence
  # would have ended the wait on a blip, with no verdict at all.
  until: (so_setup_poll.stdout | default('')) is search('SOSETUP_(DONE|FINISHED|STALLED)')
  retries: "{{ (so_search_install_timeout / so_search_poll_interval) | int }}"
  delay: "{{ so_search_poll_interval }}"
  changed_when: false
  failed_when: false
  when: not so_setup_can_skip

- name: Read the tail of the so-setup log
  ansible.builtin.shell: tail -40 "{{ so_search_setup_log }}"
  args:
    executable: /bin/bash
  register: so_setup_tail
  changed_when: false
  failed_when: false
  when: not so_setup_can_skip

- name: Report the so-setup verdict
  ansible.builtin.debug:
    msg: |
      so-setup: {{ so_setup_poll.stdout | default('(no verdict)') | trim }}
      Last 40 log lines:
      {{ so_setup_tail.stdout | default('<no log captured>') }}
  when: not so_setup_can_skip

- name: Fail if so-setup did not complete
  ansible.builtin.fail:
    msg: |
      so-setup did not complete on {{ inventory_hostname }}.

      Verdict: {{ so_setup_poll.stdout | default('(none — the poll never returned one)') | trim }}

      SOSETUP_STALLED   the process is alive but {{ so_search_setup_log }} stopped growing
                        for {{ so_search_stall_seconds }}s. Wedged, not slow.
      SOSETUP_FINISHED  the process exited. NOT a failure -- the checks after
                        this one judge whether it worked. If you are reading
                        this with FINISHED in the verdict, the condition on this
                        task is wrong.
      (none)            the poll exhausted its retries, so so-setup was STILL
                        MAKING PROGRESS after {{ so_search_install_timeout }}s. Raise
                        so_search_install_timeout; nothing is broken.

      Full log: {{ so_search_setup_log }}
  when:
    - not so_setup_can_skip
    # ONLY a wedge, or no verdict at all, is fatal here. SOSETUP_FINISHED means
    # the process exited, and the outcome checks below get to judge whether it
    # succeeded -- which is their job, not this one's.
    - "not ((so_setup_poll.stdout | default('')) is search('SOSETUP_(DONE|FINISHED)'))"

# so-setup's exit code is NOT trustworthy. Verified 2026-07-28 on the
# sensor: it logged "WARNING: Errors detected during setup" with a fatal
# NetworkManager error and still exited 0. SO writes its own signals
# instead — a /root/failure marker file and /root/errors.log. Check those
# first; they are authoritative where rc is not.
- name: Check SO's own failure marker
  ansible.builtin.stat:
    path: /root/failure
  register: so_failure_marker
  when: not so_setup_can_skip

- name: Read SO's errors.log (for the failure message)
  ansible.builtin.slurp:
    src: /root/errors.log
  register: so_errors_log
  failed_when: false
  when: not so_setup_can_skip

# /root/failure alone is NOT grounds to fail. See the long note in
# so_manager/tasks/main.yml: the SimSpace image pre-bakes SO remnants, so
# so-setup always takes its reinstall path, whose elastic-agent uninstall
# logs "notify Fleet: failed" against a Fleet server that is not up yet.
# SO writes /root/failure for that and then succeeds anyway. Failing here
# would break every fresh deploy. Warn; let the outcome checks gate.
- name: Report SO's failure marker + errors.log (warning, not fatal)
  ansible.builtin.debug:
    msg: |
      NOTE: SO wrote /root/failure on {{ inventory_hostname }}. Often benign on
      this image — see so_manager/tasks/main.yml. Judge success by the Salt
      + so-status checks that follow.

      /root/errors.log:
      {{ (so_errors_log.content | b64decode) if so_errors_log.content is defined
         else '<errors.log unreadable>' }}

      Full setup log: {{ so_search_setup_log }} (ours) and /root/sosetup.log
      (SO's own, more detail).
  when:
    - not so_setup_can_skip
    - so_failure_marker.stat.exists

# Second net: even with no failure marker, confirm Salt actually landed.
- name: Re-probe for Salt after so-setup
  ansible.builtin.stat:
    path: /etc/salt/minion
  register: salt_minion_id_after
  when: not so_setup_can_skip

- name: Fail if so-setup exited 0 but never installed Salt
  ansible.builtin.fail:
    msg: |
      so-setup exited 0 on {{ inventory_hostname }} but Salt was never
      installed — /etc/salt/minion does not exist. The exit code lied.
      Do NOT trust rc here. Check {{ so_search_setup_log }} on the host;
      if that file is missing entirely, so-setup never actually ran.
  when:
    - not so_setup_can_skip
    - not salt_minion_id_after.stat.exists

# Marker for so-setup completion — separate from the final "installed"
# marker so retries only re-run grid-join + verify, not the 30-45 min
# so-setup call. Only reached once Salt is confirmed present above.
- name: Mark so-setup as completed (short-circuits shell task on retry)
  ansible.builtin.file:
    path: "{{ so_search_setup_marker }}"
    state: touch
    mode: '0644'
    owner: root
    group: root
  when: not so_setup_can_skip

# so-setup regenerates this minion's keypair on every (re)install. If the
# master still holds the OLD public key for this minion id, it rejects the
# new one and salt-minion crash-loops out with 77/NOPERM:
#   [CRITICAL] The Salt Master has rejected this minion's public key!
# Verified 2026-07-28 on so-sensor-1. Delete the stale key so the fresh
# one arrives as Unaccepted and grid-join below can accept it normally.
# Gated on `not so_setup_can_skip` — only when so-setup just re-ran and we
# therefore know the keypair was regenerated. Never touch a healthy grid
# member's key.
- name: Grid join — delete stale salt key for this minion on the master
  ansible.builtin.command: "sudo salt-key -d {{ inventory_hostname }}_{{ so_role }} -y"
  delegate_to: "{{ groups['so_manager'][0] }}"
  become: true
  register: stale_key_del
  changed_when: "'Removed' in stale_key_del.stdout"
  # "does not match any ... keys" on a first install is the expected no-op.
  failed_when: false
  when: not so_setup_can_skip

# Reboot FIRST so salt-minion restarts fresh + auto-submits its key to
# master. Grid-join tasks below wait for that key to appear before trying
# to accept it — otherwise so-minion -o=add races with the minion's own
# initial auth attempt and hits "does not match any unaccepted keys"
# (verified 2026-07-27 on so-search first fresh deploy: firewall opened,
# but pillar generation never happened because the key wasn't yet pending
# when so-minion ran).
- name: Reboot the search node
  # 1800, matching every other reboot in this repo. Raised 2026-09-23 so
  # there is ONE ceiling to reason about rather than three. A ceiling, not
  # a delay: reboot returns as soon as the node answers.
  ansible.builtin.reboot:
    reboot_timeout: 1800
    connect_timeout: 60
    post_reboot_delay: 30

# --- Grid-join handshake (delegated to manager, POST-reboot) ------------
# so-setup only performs a lightweight one-shot handshake at install time
# via SOREMOTEPASS. It does NOT re-invoke on subsequent minion re-auth,
# and it does NOT populate so-firewall or generate the per-minion pillar.
# Result: after so-setup completes with rc=0, the joining node is
# actually stuck — salt-minion can't reach master (firewall drops
# TCP 4505/4506), and highstate would fail even if it could
# (per-minion pillar missing).
#
# Fix: delegate four tasks to the manager to finish grid-join steps
# so-setup should have done itself:
#   1. Add this node's IP to the appropriate so-firewall hostgroup so
#      TCP 4505/4506 (salt master) opens for it.
#   2. Wait for this node's salt-key to appear in Unaccepted (may take
#      30-90s post-reboot before salt-minion connects + submits key).
#   3. Run so-minion -o=add to accept the salt-key AND generate the
#      per-minion pillar files under /opt/so/saltstack/local/pillar/minions/.
#   4. Kick a state.highstate for this node so it pulls docker
#      + container images + configs from the master in one push.

- name: Grid join — preflight, confirm salt-key is invokable on manager
  ansible.builtin.command: "sudo salt-key --version"
  delegate_to: "{{ groups['so_manager'][0] }}"
  become: true
  changed_when: false
  # Fail fast and loud. Without this, a missing/renamed salt-key binary is
  # swallowed by the 30×10s `until` loop below — it retries a hard
  # "command not found" for a full 5 min before surfacing the real error.

- name: Grid join — wait for this node's salt-key to reach the master
  # Invoked bare (not /usr/sbin/salt-key). SO ships its OWN helpers in
  # /usr/sbin (so-firewall, so-minion), but salt's binaries come from the
  # Salt onedir package and land in /usr/bin. sudo's secure_path covers
  # them — `sudo salt-call` above already proves that.
  ansible.builtin.shell: |
    key="{{ inventory_hostname }}_{{ so_role }}"
    un=$(sudo salt-key --list=unaccepted --no-color | sed 's/^[[:space:]]*//')
    ac=$(sudo salt-key --list=accepted   --no-color | sed 's/^[[:space:]]*//')
    printf 'unaccepted:\n%s\naccepted:\n%s\n' "$un" "$ac"
    if printf '%s\n%s\n' "$un" "$ac" | grep -qxF "$key"; then
      echo "GRIDKEY_PRESENT"
    else
      echo "GRIDKEY_ABSENT"
    fi
  delegate_to: "{{ groups['so_manager'][0] }}"
  become: true
  register: pending_keys
  # Salt-minion connects to master within 30-90s post-reboot. Poll for
  # up to 5 min (30 × 10s) for our key to appear. Without this wait,
  # so-minion -o=add below races with the minion's own auth and no-ops
  # with "does not match any unaccepted keys".
  # WAIT FOR THE END STATE, NOT THE TRANSITION. Polling --list=unaccepted
  # alone is only correct on a FIRST install, where the key genuinely passes
  # through Unaccepted on its way to Accepted. A node that is already a grid
  # member never enters Unaccepted -- it reconnects with the accepted key it
  # already holds -- so on any re-run against a working grid the old gate
  # waited five minutes for a transition that could not happen and then failed
  # a healthy node. (ss-pp-so 2026-09-03: two sensors failed this way while
  # both were serving traffic with Zeek and Suricata green.)
  #
  # The reboot above carries no `when:` guard so it runs even when
  # so_setup_can_skip is true, while the stale-key delete DOES carry it and is
  # skipped -- so on a re-run the key is left in place ON PURPOSE, and the old
  # gate then demanded to see it somewhere it could never be.
  #
  # so-minion -o=add below already tolerates exactly this case
  # ("does not match any unaccepted keys"), so the gate was strictly stricter
  # than the step it exists to protect. When a gate and the operation behind it
  # disagree about what counts as ready, the gate is the one that is wrong.
  until: "'GRIDKEY_PRESENT' in pending_keys.stdout"
  retries: 30
  delay: 10
  changed_when: false

- name: Grid join — on manager, so-minion -o=add (accept key + generate per-minion pillar)
  ansible.builtin.command: "sudo /usr/sbin/so-minion -o=add -m={{ inventory_hostname }}_{{ so_role }}"
  delegate_to: "{{ groups['so_manager'][0] }}"
  become: true
  register: so_min_add
  # so-minion -o=add returns success both on fresh accept and on "key already
  # accepted, re-generating pillar" — both are what we want. Only fail on hard errors.
  failed_when:
    - so_min_add.rc != 0
    - "'does not match any unaccepted keys' not in so_min_add.stdout"

- name: Grid join — kick highstate on this node (fire-and-forget; so-status wait below covers it)
  ansible.builtin.command: "sudo salt {{ inventory_hostname }}_{{ so_role }} state.highstate --async"
  delegate_to: "{{ groups['so_manager'][0] }}"
  become: true
  changed_when: false

- name: Verify search node has joined the grid (so-status)
  ansible.builtin.command: sudo so-status
  register: so_status
  changed_when: false
  # Post grid-join push: install docker + pull the elasticsearch/logstash
  # images from the manager's registry + start the 4 search-node containers
  # (elasticsearch, logstash, sensoroni, telegraf). Empirically 8-12 min.
  # 40 × 30s = 20 min ceiling.
  retries: 40
  delay: 30
  until: so_status.rc == 0

- name: Assert so-status actually reports a healthy grid (rc alone is not proof)
  ansible.builtin.assert:
    that:
      - "'adversaries cry' in so_status.stdout or 'STATUS: OK' in so_status.stdout"
    fail_msg: |
      so-status exited 0 on {{ inventory_hostname }} but did not report a
      healthy grid. An exit code is not proof — so-setup already taught us
      that (UPSTREAM_FIXES 2026-07-28 later 6). Last lines:
      {{ so_status.stdout_lines[-15:] | join('\n') }}
    success_msg: "so-status reports a healthy grid"
    quiet: true

- name: Report search node status
  ansible.builtin.debug:
    msg: "{{ so_status.stdout_lines[-15:] }}"

# so-setup does NOT write this marker on its own (2026-07-23). Touch it
# AFTER so-status verify passes so the idempotency probe at the top of
# this role short-circuits ONLY on truly complete runs. If a run fails
# at grid-join or so-status verify, a re-invocation will re-execute
# grid-join tasks instead of assuming completion.
- name: Write installed marker for idempotent re-runs (only after so-status green)
  ansible.builtin.file:
    path: "{{ so_search_installed_marker }}"
    state: touch
    mode: '0644'
    owner: root
    group: root
