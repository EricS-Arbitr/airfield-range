---
- name: Restart NetworkManager
  listen: Restart NetworkManager
  become: true
  ansible.builtin.service:
    name: NetworkManager
    state: restarted

- name: Restart squid
  listen: Restart squid
  become: true
  ansible.builtin.service:
    name: squid
    enabled: true
    state: restarted

- name: Restart apache2
  listen: Restart apache2
  become: true
  ansible.builtin.service:
    name: apache2
    enabled: true
    state: restarted

- name: Reboot Linux
  become: true
  ansible.builtin.reboot:
    reboot_timeout: 120

# 1800, not 600. A member workstation is back in two or three minutes; a
# domain controller on its first boot after promotion has to bring up NTDS,
# Netlogon, ADWS and SYSVOL replication before it answers, and routinely takes
# longer than ten minutes. On 2026-09-19 bs-dc01 and bs-dc02 both hit
#
#   Timed out waiting for last boot time check (timeout=600.0)
#   "rebooted": true, "elapsed": 608
#
# ...having actually rebooted fine. The handler gave up six hundred seconds in
# and both DCs failed out of the run over a wait that was simply too short.
#
# This is a CEILING, not a delay: a host that comes back in 90 seconds still
# takes 90 seconds. Raising it costs nothing and removes a whole class of
# false failure.
- name: Reboot Windows
  ansible.windows.win_reboot:
    reboot_timeout: 1800

- name: reload unbound
  community.docker.docker_container_exec:
    container: "{{ global_dns_container_name }}"
    command: unbound-control reload
  ignore_errors: yes

- name: Update CA Certificates
  ansible.builtin.command:
    cmd: /usr/sbin/update-ca-certificates

- name: Recreate email container
  listen: Recreate email container
  ansible.builtin.shell: docker compose up -d --no-deps outlook
  args:
    chdir: /home/simspace

- name: Run add_users in email container
  listen: Run add_users in email container
  community.docker.docker_container_exec:
    container: email
    command: /bin/bash /add_users.sh

- name: Restart email container
  listen: Restart email container
  ansible.builtin.shell: docker restart email

