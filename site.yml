# =============================================================================
# SOC tier — syslog backbone
# =============================================================================
# Central rsyslog collector on soc-syslog (172.31.7.13), receives over UDP+TCP
# 514, writes per-host files at /var/log/remote/<hostname>/syslog.log. Linux
# hosts and VyOS routers forward into it. pfSense + Wazuh + SIEM ingest come
# in the next batch.


# Squid's ACCESS log now goes to the Elastic agent, not to files or syslog.
# The squid integration's input is `udp` (the package manifest says
# squid.log carries input=udp, not logfile), so squid has to SEND rather than
# the agent tailing a file. Squid supports a udp:// destination natively, so
# this goes straight to the agent on loopback.
#
# The two log lines this replaces, both from roles/squid/files/squid.conf:
#   access_log /var/log/squid/access.log splunk_json_squid
#       Splunk-specific JSON. Splunk was removed from this range 2026-09-15;
#       nothing consumes it.
#   access_log syslog:local2 combined
#       Went to the host's own /var/log/syslog, where the system integration
#       picks it up and ships it to SO as UNPARSED message text. Removing it
#       deletes that duplicate at source; the parsed copy in
#       logs-squid.log-* replaces it with real fields.
#
# Squid's own system messages still reach soc-syslog via the host's `*.*`
# rsyslog forward. Only the ACCESS log stops going there.
#
# A play, not a role edit: squid is a customer base role and workarounds are
# plays (CLAUDE.md role-sourcing policy).
- name: Squid — send access log to the Elastic agent instead of files/syslog
  hosts: proxy
  gather_facts: false
  become: true
  tasks:
    - name: Remove the Splunk-format access_log line
      ansible.builtin.lineinfile:
        path: /etc/squid/squid.conf
        regexp: '^access_log\s+/var/log/squid/access\.log\s+splunk_json_squid'
        state: absent
      register: squid_rm_splunk

    - name: Remove the syslog access_log line (duplicate into system.syslog)
      ansible.builtin.lineinfile:
        path: /etc/squid/squid.conf
        regexp: '^access_log\s+syslog:local2'
        state: absent
      register: squid_rm_syslog

    - name: Send the access log to the Elastic agent over loopback UDP
      ansible.builtin.lineinfile:
        path: /etc/squid/squid.conf
        regexp: '^access_log\s+udp://'
        line: "access_log udp://127.0.0.1:9537 squid"
        insertafter: '^#?\s*access_log'
        state: present
      register: squid_add_udp

    # Reload, not restart: squid re-reads config without dropping in-flight
    # client connections, and the range has live user emulation against it.
    - name: Reload squid if the log destinations changed
      ansible.builtin.command: squid -k reconfigure
      when: squid_rm_splunk.changed or squid_rm_syslog.changed or squid_add_udp.changed
      changed_when: true

    # Positive proof the line is actually in force, not merely in the file.
    - name: Confirm squid is running with the udp destination
      ansible.builtin.command: grep -c "^access_log udp://127.0.0.1:9537 squid" /etc/squid/squid.conf
      register: squid_udp_check
      changed_when: false
      failed_when: squid_udp_check.rc != 0
  tags:
    - squid
    - squid_logging

- name: Syslog collector — soc-syslog
  hosts: soc-syslog
  gather_facts: false
  become: true
  roles:
    - syslog_server
  tags:
    - syslog
    - syslog_server

- name: Syslog client — Linux
  hosts: linux:!syslog
  gather_facts: false
  become: true
  tasks:
    - name: Drop rsyslog forwarder snippet
      ansible.builtin.copy:
        dest: /etc/rsyslog.d/00-forward.conf
        owner: root
        group: root
        mode: '0644'
        content: |
          # Forward all logs to soc-syslog (the central rsyslog collector).
          # Managed by Ansible (site.yml). UDP — accepted on both UDP+TCP by
          # the server; UDP avoids the queue-up failure mode if soc-syslog
          # is briefly unreachable.
          *.* @{{ syslog_server_ip }}:514
      register: rsyslog_forward

    - name: Restart rsyslog if forwarder snippet changed
      ansible.builtin.systemd:
        name: rsyslog
        state: restarted
      when: rsyslog_forward.changed
  tags:
    - syslog
    - syslog_client

